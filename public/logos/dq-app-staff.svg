<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    DQ STAFF APP ICON — 1024×1024
    Personality: Functional, operational, sharp
    Background: Deep slate-dark (authority, focus)
    Accent: Cyan (#22d3ee) — active, alert, digital scanning

    This is the staff tool — live orders, exit QR validation, action.
    Dark bg = serious/work mode. Cyan = digital signals, scanning beams.
  -->

  <defs>
    <linearGradient id="bg-staff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg-staff)"/>

  <!-- Inner glow — tighter, cooler -->
  <rect
    x="2" y="2" width="1020" height="1020" rx="222"
    fill="none"
    stroke="rgba(34,211,238,0.15)"
    stroke-width="4"
  />

  <!-- DQ MARK — white on dark -->
  <path
    d="M 168 320 L 240 320 A 192 192 0 0 1 240 704 L 168 704 Z"
    fill="white"
  />

  <circle
    cx="664" cy="512" r="192"
    fill="none"
    stroke="white"
    stroke-width="72"
  />

  <!-- Cyan exit tail — operational "signal" feel -->
  <line
    x1="742" y1="647" x2="800" y2="746"
    stroke="#22d3ee"
    stroke-width="72"
    stroke-linecap="round"
  />
</svg>
