<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <!--
    DQ HORIZONTAL BRAND LOGO
    For website headers, documents, marketing material.
    Light background version.

    Layout: [DQ geometric mark 100×100] + [DQ wordmark] + [STORE label]
  -->

  <!-- ===== ICON MARK (scaled to 100×100) ===== -->
  <!-- Scale from master 1024→100: factor 0.09766 -->

  <!-- D: M 16.4 31.3 L 23.4 31.3 A 18.75 18.75 0 0 1 23.4 68.75 L 16.4 68.75 Z -->
  <path
    d="M 16 31 L 24 31 A 19 19 0 0 1 24 69 L 16 69 Z"
    fill="#16a34a"
  />

  <!-- Q ring: cx=64.8, cy=50, r=18.75, stroke-width=7 -->
  <circle
    cx="65" cy="50" r="19"
    fill="none"
    stroke="#16a34a"
    stroke-width="7"
  />

  <!-- Amber exit tail -->
  <!-- inner@60°: (65+15.2×0.5, 50+15.2×0.866)=(72.6, 63.2) → (73, 63) -->
  <!-- end: (73+4.3, 63+7.4)=(77.3, 70.4) → (78, 71) -->
  <line
    x1="73" y1="63" x2="78" y2="73"
    stroke="#f59e0b"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- ===== WORDMARK ===== -->
  <!-- "DQ" — primary brand name, dark green, heavy weight -->
  <text
    x="108" y="56"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="48"
    fill="#14532d"
    letter-spacing="-1"
  >DQ</text>

  <!-- "STORE" — product category, spaced uppercase, gray -->
  <text
    x="110" y="74"
    font-family="'Arial', Helvetica, sans-serif"
    font-weight="600"
    font-size="15"
    fill="#6b7280"
    letter-spacing="5"
  >STORE</text>
</svg>
